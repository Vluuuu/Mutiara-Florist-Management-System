[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Dynamic process management tuned strictly for Render Free (512 MB RAM ceiling)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Execution limits
request_terminate_timeout = 60s
