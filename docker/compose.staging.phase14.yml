# ==============================================================================
# MFMS Phase 14B Staging Dual-Runtime Compose (Ubuntu Host Reconciled)
#
# Target Host Directory : ~/apps/mfms-staging
# Target Config Dir     : ~/apps/mfms-config/staging.env & staging-demo.env
# Target Loopback Port  : 127.0.0.1:10000 (unchanged for cloudflared tunnel)
# Target Public Domain  : https://staging-admin.mutiaraflorist.id
#
# Non-Destructive Policy:
# - Uses dedicated image tag (MFMS_IMAGE, e.g. mfms:phase14b-<sha>)
# - Preserves existing Phase 13 images, volumes, and ~/apps/mfms-config/staging.env
# - Never touches ~/apps/mfms-production or 127.0.0.1:10001
# ==============================================================================

services:
  mfms-staging-router:
    image: nginx:1.27-alpine
    container_name: mfms-staging-router
    restart: unless-stopped
    depends_on:
      - mfms-staging-app
      - mfms-staging-demo
    ports:
      - "127.0.0.1:10000:10000"
    environment:
      NGINX_ENVSUBST_FILTER: "^MFMS_"
      MFMS_PRIMARY_UPSTREAM: "mfms-staging-app:10000"
      MFMS_DEMO_UPSTREAM: "mfms-staging-demo:10000"
      MFMS_SERVER_NAMES: "staging-admin.mutiaraflorist.id"
    volumes:
      - ./nginx-router.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - mfms-staging-net
    mem_limit: 48m
    cpus: 0.25
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:10000/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  mfms-staging-app:
    image: ${MFMS_IMAGE:-mfms:phase14b}
    container_name: mfms-staging-app
    restart: unless-stopped
    env_file:
      - ${MFMS_STAGING_ENV_FILE:-/home/ubuntu/apps/mfms-config/staging.env}
    environment:
      PORT: "10000"
      MFMS_RUNTIME_MODE: "production"
      SESSION_COOKIE: "mfms_staging_admin_session"
      DEMO_ENTRY_LINK_ENABLED: "true"
    networks:
      - mfms-staging-net
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 64
    security_opt:
      - no-new-privileges:true

  mfms-staging-demo:
    image: ${MFMS_IMAGE:-mfms:phase14b}
    container_name: mfms-staging-demo
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint-demo.sh"]
    env_file:
      - ${MFMS_STAGING_DEMO_ENV_FILE:-/home/ubuntu/apps/mfms-config/staging-demo.env}
    environment:
      PORT: "10000"
      MFMS_RUNTIME_MODE: "demo"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/lib/mfms-demo/demo.sqlite"
      DEMO_SQLITE_PATH: "/var/lib/mfms-demo/demo.sqlite"
      DEMO_KILL_SWITCH_FILE: "/var/lib/mfms-demo/demo.disabled"
      DEMO_RESET_LOCK_FILE: "/var/lib/mfms-demo/reset.lock"
      DEMO_RESETTING_FLAG_FILE: "/var/lib/mfms-demo/resetting.flag"
      SESSION_DRIVER: "file"
      SESSION_COOKIE: "mfms_demo_session"
      CACHE_STORE: "file"
      QUEUE_CONNECTION: "sync"
      CLOUDFLARE_ACCESS_ENFORCE: "false"
    volumes:
      - mfms-staging-demo-data:/var/lib/mfms-demo
    networks:
      - mfms-staging-net
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 48
    security_opt:
      - no-new-privileges:true

networks:
  mfms-staging-net:
    driver: bridge

volumes:
  mfms-staging-demo-data:
    driver: local
