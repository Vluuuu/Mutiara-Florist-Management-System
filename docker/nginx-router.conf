# ==============================================================================
# MFMS Phase 14B Same-Domain Edge Router (standalone reference config)
# Mirrors docker/nginx-router.conf.template: defaults to mfms-prod unless
# mfms_runtime=demo or /demo is explicitly selected.
# ==============================================================================

limit_req_zone $binary_remote_addr zone=mfms_login:5m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mfms_general:10m rate=60r/m;

map $cookie_mfms_runtime $mfms_upstream {
    "demo"  "mfms-demo:10000";
    default "mfms-prod:10000";
}

map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $mfms_upstream $forwarded_cf_jwt {
    "mfms-prod:10000" $http_cf_access_jwt_assertion;
    default           "";
}

map $mfms_upstream $forwarded_edge_secret {
    "mfms-prod:10000" $http_x_mfms_edge_secret;
    default           "";
}

server {
    listen 10000 default_server;
    listen [::]:10000 default_server;
    server_name admin.mutiaraflorist.id staging-admin.mutiaraflorist.id _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server_tokens off;
    client_max_body_size 2m;

    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location ^~ /build/ {
        proxy_pass http://$mfms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cf-Access-Jwt-Assertion $forwarded_cf_jwt;
        proxy_set_header X-MFMS-Edge-Secret $forwarded_edge_secret;
    }

    location = /admin-entry {
        set $primary_target "mfms-prod:10000";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://$primary_target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /demo {
        set $demo_target "mfms-demo:10000";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://$demo_target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header X-MFMS-Edge-Secret "";
    }

    location = /login {
        limit_req zone=mfms_login burst=10 nodelay;
        limit_req_status 429;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_pass http://$mfms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cf-Access-Jwt-Assertion $forwarded_cf_jwt;
        proxy_set_header X-MFMS-Edge-Secret $forwarded_edge_secret;
    }

    location / {
        limit_req zone=mfms_general burst=40 nodelay;
        limit_req_status 429;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_pass http://$mfms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cf-Access-Jwt-Assertion $forwarded_cf_jwt;
        proxy_set_header X-MFMS-Edge-Secret $forwarded_edge_secret;
    }
}
