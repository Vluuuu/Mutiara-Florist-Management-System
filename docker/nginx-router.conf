# ==============================================================================
# MFMS Phase 14A Same-Domain Edge Router (https://admin.mutiaraflorist.id)
# Routes traffic cleanly between isolated mfms-prod and mfms-demo containers.
#
# Security Invariants:
# 1. Production upstream (mfms-prod) is ONLY selected when Cloudflare Access
#    injected Cf-Access-Jwt-Assertion AND the client is not in demo mode.
# 2. Requests without Cf-Access-Jwt-Assertion NEVER reach mfms-prod.
# 3. Cf-Access-Jwt-Assertion & X-MFMS-Edge-Secret are stripped before proxying
#    to mfms-demo so production edge headers never enter the demo container.
# 4. mfms-prod itself remains strictly fail-closed via VerifyCloudflareAccessJwt.
# ==============================================================================

limit_req_zone $binary_remote_addr zone=mfms_login:5m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mfms_general:10m rate=60r/m;

map $http_cf_access_jwt_assertion $has_cf_jwt {
    ""      0;
    default 1;
}

map "${has_cf_jwt}:${cookie_mfms_runtime}" $mfms_upstream {
    "1:demo"  mfms_demo;
    "1:"      mfms_prod;
    ~^1:      mfms_prod;
    default   mfms_demo;
}

# Never forward Cloudflare Zero Trust headers or edge secrets to mfms-demo
map $mfms_upstream $forwarded_cf_jwt {
    mfms_prod $http_cf_access_jwt_assertion;
    default   "";
}

map $mfms_upstream $forwarded_edge_secret {
    mfms_prod $http_x_mfms_edge_secret;
    default   "";
}

upstream mfms_prod {
    server mfms-prod:10000 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

upstream mfms_demo {
    server mfms-demo:10000 max_fails=3 fail_timeout=10s;
    keepalive 4;
}

server {
    listen 10000 default_server;
    listen [::]:10000 default_server;
    server_name admin.mutiaraflorist.id staging-admin.mutiaraflorist.id _;

    server_tokens off;
    client_max_body_size 2m;

    # Router liveness check
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Dedicated Cloudflare-Access-OTP-protected admin entry point -> ALWAYS mfms-prod
    location = /admin-entry {
        proxy_pass http://mfms_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Explicit entry to demo login (allows CF-authenticated admin to switch cleanly to demo)
    location = /demo {
        proxy_pass http://mfms_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header X-MFMS-Edge-Secret "";
    }

    # Rate-limited login endpoint
    location = /login {
        limit_req zone=mfms_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://$mfms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cf-Access-Jwt-Assertion $forwarded_cf_jwt;
        proxy_set_header X-MFMS-Edge-Secret $forwarded_edge_secret;
    }

    # All application traffic routed strictly by upstream map
    location / {
        limit_req zone=mfms_general burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://$mfms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cf-Access-Jwt-Assertion $forwarded_cf_jwt;
        proxy_set_header X-MFMS-Edge-Secret $forwarded_edge_secret;
    }
}
