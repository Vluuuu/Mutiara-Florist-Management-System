[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Conservative FPM pool tuned for isolated Demo container (256 MB RAM limit)
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.process_idle_timeout = 10s
pm.max_requests = 300

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Execution limits
request_terminate_timeout = 30s
